name: Test LIVE Ritual Engine
on:
  pull_request:
  push:
    branches: [main, feature/ritual-engine-rpc-v1]
    paths:
      - 'live/**'
      - '.github/workflows/live-tests.yml'
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm ci
        working-directory: live
      - run: npm test
        working-directory: live
      - run: node --check server.mjs
        working-directory: live
